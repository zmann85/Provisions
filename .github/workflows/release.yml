# Releases are driven by CHANGELOG.md: when a push to main changes it and its
# first "## vX.Y" heading names a version that has no tag yet, this workflow
# tags that commit, builds the zip, makes a GitHub release and uploads it to
# CurseForge. Versions containing "beta"/"alpha" upload as Beta/Alpha files.
# Pushing a tag like v1.6 by hand also works.
name: Package and release

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag new version from CHANGELOG.md
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          v=$(grep -m1 -oP '^##\s+\Kv[0-9][^\s]*' CHANGELOG.md || true)
          if [ -z "$v" ]; then
            echo "No '## vX.Y' heading in CHANGELOG.md, nothing to release"; exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "$v is already released"; exit 0
          fi
          git tag "$v"
          git push origin "refs/tags/$v"
          echo "Tagged $v"
          echo "tag=$v" >> "$GITHUB_OUTPUT"

      # Run the packager script directly and present the build as a tag build:
      # a tag pushed by this workflow never starts a run of its own, and the
      # packager skips branch pushes whose commit already has a tag.
      - name: Package and upload
        if: steps.ver.outputs.tag != ''
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git clone -q --depth 1 -b v2 https://github.com/BigWigsMods/packager "$RUNNER_TEMP/packager"
          GITHUB_EVENT_NAME=push GITHUB_REF="refs/tags/$TAG" GITHUB_REF_NAME="$TAG" GITHUB_REF_TYPE=tag \
            bash "$RUNNER_TEMP/packager/release.sh"
