<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#3a2a1c"/>
      <stop offset="0.6" stop-color="#1c1510"/>
      <stop offset="1" stop-color="#0e0b08"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f2b860" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f2b860" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b45a"/>
      <stop offset="0.55" stop-color="#c9772b"/>
      <stop offset="1" stop-color="#7a3f14"/>
    </linearGradient>
    <linearGradient id="potion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a5a"/>
      <stop offset="1" stop-color="#8e1020"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#9c7326"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="400" height="400" rx="56" fill="url(#bg)"/>
  <rect x="14" y="14" width="372" height="372" rx="44" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="200" cy="210" r="160" fill="url(#glow)"/>

  <g transform="translate(20,-6)">
  <!-- potion flask, behind the bread -->
  <g transform="translate(250,95)">
    <rect x="-16" y="0" width="32" height="18" rx="4" fill="#8a5a2b"/>
    <rect x="-14" y="16" width="28" height="34" fill="#d9e6ea" fill-opacity="0.35" stroke="#e8f2f4" stroke-opacity="0.8" stroke-width="4"/>
    <circle cx="0" cy="110" r="70" fill="#d9e6ea" fill-opacity="0.25" stroke="#e8f2f4" stroke-opacity="0.85" stroke-width="5"/>
    <path d="M -66 118 A 66 66 0 0 0 66 118 C 40 104 -40 132 -66 118 Z" fill="url(#potion)"/>
    <path d="M -66 118 C -40 132 40 104 66 118 A 66 66 0 0 1 -66 118 Z" fill="url(#potion)"/>
    <path d="M -44 70 A 52 52 0 0 1 -6 54" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- loaf of bread -->
  <g transform="translate(160,262)">
    <ellipse cx="0" cy="62" rx="118" ry="14" fill="#000" fill-opacity="0.45"/>
    <path d="M -118 40 C -124 -30 -60 -72 0 -72 C 60 -72 124 -30 118 40 C 116 58 100 62 80 62 L -80 62 C -100 62 -116 58 -118 40 Z"
          fill="url(#crust)" stroke="#5a2c0c" stroke-width="5"/>
    <path d="M -96 6 C -90 -38 -46 -58 0 -60" fill="none" stroke="#fff3c4" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round"/>
    <g stroke="#7a3f14" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M -62 -26 L -38 18"/>
      <path d="M -14 -40 L 10 8"/>
      <path d="M 34 -36 L 58 8"/>
    </g>
    <g stroke="#ffe2a0" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M -58 -24 L -36 14"/>
      <path d="M -10 -38 L 12 4"/>
      <path d="M 38 -34 L 58 2"/>
    </g>
  </g>
  </g>
